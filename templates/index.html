<!DOCTYPE html>
{% load tailwind_tags %} {% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <title>index</title>
    {% tailwind_css %}
    

  </head>
  
  <body>
    <div id="app"> <!-- Main container -->

      <div id="map"></div>

      <div id="rightContent">
      
        <!-- Search bar -->
        <input type="text" id="searchBox" placeholder="Search for a city, place, or shop" />

        <!-- Button to trigger the search -->
        <button id="searchButton">Search</button>
      
        <!-- Radius slider -->
        <label for="radiusSlider">Choose radius (in meters): <span id="radiusValue">100</span> m</label>
        <input type="range" id="radiusSlider" min="0" max="6" value="1" step="1" />


      </div>
    </div>



    <!-- Ajouter le fichier JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{% static 'js/script.js' %}"></script>

  </body>
</html>
