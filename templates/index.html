<!DOCTYPE html>
{% load tailwind_tags %} {% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <title>index</title>
    {% tailwind_css %}
    
    <style>
      /* Main container flex layout */
      #app {
        display: flex;
        height: 100vh;
      }
      
      /* Left side map */
      #map {
        flex: 7;
        height: 100%;
      }
      
      /* Right side content */
      #rightContent {
        flex: 3;
        padding: 20px;
        overflow-y: auto;
      }

      /* Style for the search bar */
      #searchBox {
        width: 80%;
        padding: 10px;
        margin-bottom: 20px;
        font-size: 16px;
        box-sizing: border-box;
      }
      #radiusSlider {
        width: 100%;
      }

    </style>


  </head>
  
  <body>
    <div id="app"> <!-- Main container -->

      <div id="map"></div>


      <div id="rightContent">
      
        <!-- Search bar -->
        <input type="text" id="searchBox" placeholder="Search for a city, place, or shop" />

        <!-- Button to trigger the search -->
        <button id="searchButton">Search</button>
      
        <!-- Radius slider -->
        <label for="radiusSlider">Choose radius (in meters): <span id="radiusValue">100</span> m</label>
        <input type="range" id="radiusSlider" min="0" max="6" value="1" step="1" />


      </div>
    </div>



    <!-- Ajouter le fichier JavaScript -->
    <script src="{% static 'js/script.js' %}"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // Initialiser la carte
      var map = L.map("map").setView([51.505, -0.09], 13); // Coordonnées de Londres
      var currentCircle = null; // Variable to hold the circle for updating

      // Ajouter une couche de tuiles (OpenStreetMap)
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
           '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
       }).addTo(map);


      // Radius options
      const radiusOptions = [50, 100, 250, 500, 1000, 2500, 5000];

      // Update radius value display when slider changes
      const radiusSlider = document.getElementById("radiusSlider");
      const radiusValueDisplay = document.getElementById("radiusValue");
      radiusValueDisplay.textContent = radiusOptions[radiusSlider.value];
      
      radiusSlider.addEventListener("input", function() {
        radiusValueDisplay.textContent = radiusOptions[this.value];
      });

       // Function to search for a location using Nominatim
      async function searchLocation(query) {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
        try {
          const response = await fetch(url);
          const data = await response.json();
          if (data && data.length > 0) {
            const { lat, lon } = data[0];
            map.setView([lat, lon], 13); // Center map on found location

            // Remove previous circle if it exists
            if (currentCircle) {
              map.removeLayer(currentCircle);
            }

            L.marker([lat, lon]).addTo(map) // Place marker at location
              .bindPopup(`<b>${query}</b>`);
            currentCircle = L.circle([lat, lon], { radius }).addTo(map);
            currentCircle.bindPopup(`<b>${query}</b><br>Radius: ${radius} meters`).openPopup();
          } else {
            alert("Location not found.");
          }
        } catch (error) {
          console.error("Error fetching location data:", error);
        }
      }

      // Ajouter un marqueur
//       var circle = L.circle([51.508, -0.11], {
//         color: "red",
//         fillColor: "#f03",
//         fillOpacity: 0.5,
//         radius: 5000,
//       }).addTo(map);
//       var circle2 = L.circle([51.51, -0.047], {
//         color: "yellow",
//         fillColor: "yellow",
//         fillOpacity: 0.5,
//         radius: 5000,
//       }).addTo(map);

      
       // Search functionality (example)
      document.getElementById("searchButton").addEventListener("click", function() {
        const query = document.getElementById("searchBox").value;
        const selectedRadius = radiusOptions[radiusSlider.value]; // Get radius from slider
        if (query) {
          searchLocation(query,selectedRadius);
        } else {
          alert("Please enter a location to search.");
        }      });

    </script>
  </body>
</html>
