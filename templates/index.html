<!DOCTYPE html>
{% load tailwind_tags %} {% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <title>index</title>
    {% tailwind_css %}
  </head>

  <body>
    <div id="app">
      <!-- Main container -->

      <div id="map"></div>

      <div id="rightContent">
        <form method="POST" action="{% url 'map_view' %}">
          {% csrf_token %}
          <!-- Search bar -->
          <input
            type="text"
            name="city"
            id="searchBox"
            value={{display_name}}
            placeholder="Search for a city, place, or shop"
          />
          <!-- Button to trigger the search -->
          <button id="searchButton" type="submit">Search</button>
          <div id="autocompleteContainer" class="autocomplete-list"></div>
        </form>

              <!-- Radius slider -->
              <form>
                <label for="radiusSlider"
                >Station proximity: <span id="radiusValue"></span>km</label
              >
              <input
                type="range"
                id="radiusSlider"
                class="radiusSlider"
                min="0"
                max="6"
                value="1"
                step="1"
              />

            <label for="radiusSlider2"
            >School proximity: <span id="radiusValue2"></span>km</label
          >
          <input
            type="range"
            id="radiusSlider2"
            class="radiusSlider"
            min="0"
            max="6"
            value="1"
            step="1"
          />
          <button id="" type="submit">Analyse</button>
        </form>
      </div>
           
   </div>
    </div>

    <!-- Ajouter le fichier JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      var latitude = {{ latitude }};
      var longitude = {{ longitude }};
      var display_name = "{{ display_name }}";
    </script>
    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>
