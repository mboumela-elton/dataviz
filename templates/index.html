<!DOCTYPE html>
{% load tailwind_tags %} {% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <title>index</title>
    {% tailwind_css %}
  </head>
  <body>
    <h1>Dataviz project</h1>
    <p class="text-3xl underline">{{ hello }}</p>
    <div id="map"></div>

    <!-- Ajouter le fichier JavaScript -->
    <script src="{% static 'js/script.js' %}"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // Initialiser la carte
      var map = L.map("map").setView([51.505, -0.09], 13); // Coordonnées de Londres

      // Ajouter une couche de tuiles (OpenStreetMap)
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      // Ajouter un marqueur
      var marker = L.marker([48.8584, 2.2945]).addTo(map);
      marker.bindPopup("Tour Eiffel").openPopup();

//      var marker2 = L.marker([48.8606, 2.3376]).addTo(map);
     //  marker2.bindPopup("Louvre").openPopup();

      var circle = L.circle([48.8584, 2.2945], {
        color: "red",
        fillColor: "#f03",
        fillOpacity: 0.5,
        radius: 2500,
      }).addTo(map);

      var circle2 = L.circle([48.8606, 2.3376], {
        color: "yellow",
        fillColor: "yellow",
        fillOpacity: 0.5,
        radius: 2500,
      }).addTo(map);
    </script>
  </body>
</html>
