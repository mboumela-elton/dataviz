<!DOCTYPE html>
{% load tailwind_tags %} {% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Link to custom stylesheet -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <!-- Link to Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <title>index</title>
    {% tailwind_css %}
  </head>

  <body>
    <header class="bg-gray-100 p-5 rounded-lg shadow-lg">
      <h1 class="text-5xl font-extrabold text-center text-purple-700">
          Bienvenue sur Mon Site Web
      </h1>
    </header>
    <section id="app" class="m-11 p-11">
      {% include 'main.html' %}
      {% include 'rightBar.html' %}
      {% include 'var.html' %}
    </section>

    <!-- Link to custom JavaScript file -->
    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>
